[package]
name = "lite-stream-browser"
version = "0.2.0"
description = "A tiny, memory-friendly Twitch / YouTube shell built with Tauri v2"
authors = ["Lite Stream Browser"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lite_stream_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"

# WebView2 COM interfaces for the child webviews (already in the dependency
# graph through wry, so this adds no new code to compile). `windows-core`
# provides `Interface::cast` for `ICoreWebView2Settings` ->
# `ICoreWebView2Settings2`.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# Win32 process APIs for the home screen RAM/CPU meter. The `windows` crate is
# already in the dependency graph through wry/webview2-com; only the feature
# set is extended, so no new heavy crates are added.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
] }

[features]
# Used by production builds / when no dev server is configured.
custom-protocol = ["tauri/custom-protocol"]
